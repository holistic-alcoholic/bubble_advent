<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адвент</title>
    <style>
        body {
            font-family: Georgia;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: #1f1e1c;
            color: white;
            text-align: center;
            max-width: 600px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            width: 100%;
        }
        
        h1 {
            margin-bottom: 10px;
        }
        
        .calendar-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .day-box {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;

            color: black;
        }
        
        .day-box:hover {
            transform: translateY(-5px);
        }

        .day-box-img {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .day-number {
            font-size: 2.5rem;
            font-weight: bold;
            position: absolute;
            width: 100%;
            height: 50%;
            top: 30%;
        }
        
        .day-text {
            font-size: 1rem;
            font-weight: bold;
            position: absolute;
            width: 100%;
            height: 1em;
            bottom: 15px;
        }
        
        .locked {
            cursor: not-allowed;
        }
        
        .locked:hover {
            transform: none;
        }
        
        .locked::after {
            content: "🔒";
            position: absolute;
            font-size: 1.5rem;
            margin-top: 30%;
        }
        
        .opened {
            animation: openBox 0.8s ease-out;
        }
        
        @keyframes openBox {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1.5rem;
            opacity: 0;
            animation: fall linear forwards;
        }
        
        @keyframes fall {
            to {
                top: 100%;
                opacity: 1;
            }
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 80%;
            margin: auto;
            animation: modalAppear 0.5s ease-out;
        }
        
        @keyframes modalAppear {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .modal h2 {
            font-size: 2rem;
            margin: 15px 0;
        }
        
        .modal p {
            margin: 30px 0;
        }
        
        .close-btn {
            background: #ff6600;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .close-btn:hover {
            background: #ff6b6b;
        }

        footer {
            margin-top: 40px;
            font-size: 0.8em;
            color: #ddd;
            line-height: 0.9;
        }

        a {
            color: #ff6600;
        }

        .highlighted {
            color: #ffbf1f;
        }

        ul { list-style-type: "🎁"; }

        li {
            margin: 15px 0;
        }
        
        @media (max-width: 768px) {
            .calendar-container {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .day-box {
                width: 100px;
                height: 100px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .calendar-container {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .day-box {
                width: 130px;
                height: 130px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Баббл адвент</h1>
        <p>Здесь раздают подарки тем, кто хорошо себя вел весь год в баббл фд :)</p>
    </header>
    
    <div class="calendar-container" id="calendar">
        <!-- Calendar boxes will be generated by JavaScript -->
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">День <span id="day-number">1</span></h2>
            <p id="modal-message"></p>
            <button class="close-btn" id="close-modal">Закрыть</button>
        </div>
    </div>

    <footer>
        <p>Новые подарки будут открываться в наших <a href="https://t.me/bubble_advent" target="_blank">тгк</a> и <a href="https://x.com/bubble_advent" target="_blank">твиттере</a>.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendar = document.getElementById('calendar');
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            const closeModal = document.getElementById('close-modal');
            
            // Get current date
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth() + 1; // Months are 0-indexed
            
            // Only enable calendar in December
            const isDecember = currentMonth === 12;

            const presents = [
                '<p>В этот день под ёлочкой вы находите...' + 
                    '<ul><li>анимацию с <strong class="highlighted">сероволками</strong> от <a href="https://t.me/molokoblyat" target="_blank">Сороки</a>! Смотреть и комментировать — в <a href="https://t.me/bubble_advent/23" target="_blank">тгк</a> или <a href="https://x.com/bubble_advent/status/2003846652155900057?s=20" target="_blank">твиттере</a></li>' + '<li>текст с <strong class="highlighted">крестовыми дамами</strong> от <a href="https://t.me/aucosmic" target="_blank"> autorcosmic</a>! Читать и комментировать — <a href="https://archiveofourown.org/collections/bubble_advent/works/76317396" target="_blank">здесь</a> или <a href="https://archiveofourown.gay/collections/bubble_advent/works/76317396" target="_blank">на домене gay</a></li></ul></p>',
                '<p>Скоро под ёлочкой окажется что-то очень интересное... Подожди ещё немного и следи за нашими соцсетями 👀<br>',
                '<p>Скоро под ёлочкой окажется что-то очень интересное... Подожди ещё немного и следи за нашими соцсетями 👀<br>',
                '<p>Скоро под ёлочкой окажется что-то очень интересное... Подожди ещё немного и следи за нашими соцсетями 👀<br>',
                '<p>Скоро под ёлочкой окажется что-то очень интересное... Подожди ещё немного и следи за нашими соцсетями 👀<br>',
                '<p>Скоро под ёлочкой окажется что-то очень интересное... Подожди ещё немного и следи за нашими соцсетями 👀<br>',
                '<p>Скоро под ёлочкой окажется что-то очень интересное... Подожди ещё немного и следи за нашими соцсетями 👀<br>',
                '<p>Скоро под ёлочкой окажется что-то очень интересное... Подожди ещё немного и следи за нашими соцсетями 👀<br>'
            ]
            
            // Create calendar boxes
            for (let i = 24; i <= 31; i++) {
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                dayBox.id = `day-${i}`;

                const image = document.createElement('img');
                image.src = 'assets/present.png';
                image.className = 'day-box-img';
                image.loading = 'lazy';
                dayBox.appendChild(image);
                
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = i;
                
                const dayText = document.createElement('div');
                dayText.className = 'day-text';
                dayText.textContent = 'декабря';
                
                dayBox.appendChild(dayNumber);
                dayBox.appendChild(dayText);
                
                // Check if box should be locked or unlocked
                if (i > currentDay) {
                    dayBox.classList.add('locked');
                    image.src = 'assets/present-grey.png';
                } else {
                    dayBox.addEventListener('click', function() {
                        openBox(i);
                    });
                }
                
                calendar.appendChild(dayBox);
            }
            
            // Function to open a box
            function openBox(day) {
                const box = document.getElementById(`day-${day}`);
                
                // Create snowflake animation
                createSnowflakes(box);
                
                // Add opened class for animation
                box.classList.add('opened');
                box.children[0].src = 'assets/present-green.png';
                
                // Show modal after a short delay
                setTimeout(() => {
                    modalTitle.innerHTML = `<span id="day-number">${day}</span> декабря`;
                    modalMessage.innerHTML = presents[day - 24];
                    modal.style.display = 'flex';
                }, 800);
            }
            
            // Function to create snowflake animation
            function createSnowflakes(box) {
                const snowflakes = ['❄️', '✨', '☃️', '☃', '🎄'];
                
                for (let i = 0; i < 10; i++) {
                    const snowflake = document.createElement('div');
                    snowflake.className = 'snowflake';
                    snowflake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                    snowflake.style.left = `${Math.random() * 100}%`;
                    snowflake.style.animationDuration = `${Math.random() * 2 + 1}s`;
                    snowflake.style.animationDelay = `${Math.random() * 0.5}s`;
                    
                    box.appendChild(snowflake);
                    
                    // Remove snowflake after animation completes
                    setTimeout(() => {
                        snowflake.remove();
                    }, 3000);
                }
            }
            
            // Close modal
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            // Close modal when clicking outside
            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
